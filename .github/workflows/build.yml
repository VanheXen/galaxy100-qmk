name: Build firmware

on:
  push:
    branches: [main, "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VIA firmware version strings match (P07)
        run: |
          h=$(sed -n 's/^#define VIA_FIRMWARE_VERSION[[:space:]]\+\([0-9]\+\).*/\1/p' keyboards/epomaker/galaxy100/config.h)
          j=$(sed -n 's/.*"firmwareVersion"[[:space:]]*:[[:space:]]*\([0-9]\+\).*/\1/p' via/galaxy100_via.json)
          echo "config.h=$h via.json=$j"
          [ -n "$h" ] && [ "$h" = "$j" ] || { echo "::error::VIA firmware version mismatch"; exit 1; }

      - name: Clone mainline QMK (pinned, P45)
        env:
          # Known-good commit: the one both keymaps were compiled against locally.
          QMK_REF: 7a1bbf37c5c07da4ea0a162bb139083a46ef40a1
        run: |
          git init /qmk
          cd /qmk
          git remote add origin https://github.com/qmk/qmk_firmware
          git fetch --depth 1 origin "$QMK_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          qmk config user.qmk_home=/qmk

      - name: Link board files
        run: |
          mkdir -p /qmk/keyboards/epomaker
          ln -s "$GITHUB_WORKSPACE/keyboards/epomaker/galaxy100" /qmk/keyboards/epomaker/galaxy100
          ln -s "$GITHUB_WORKSPACE/keyboards/epomaker/linker"    /qmk/keyboards/epomaker/linker

      - name: Compile
        run: |
          qmk compile -kb epomaker/galaxy100 -km via
          qmk compile -kb epomaker/galaxy100 -km default
          cp /qmk/epomaker_galaxy100_via.bin .   # default keymap: compile check only

      - name: Check via.o redirect was applied (P10)
        run: |
          o=/qmk/.build/obj_epomaker_galaxy100_via/quantum/via.o
          [ -f "$o" ] || { echo "::error::$o missing"; exit 1; }
          grep -aq replaced_hid_send "$o" || { echo "::error::wireless.mk via.o raw_hid_send redirect not applied"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: galaxy100-firmware
          path: |
            epomaker_galaxy100_via.bin
            via/galaxy100_via.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            epomaker_galaxy100_via.bin
            via/galaxy100_via.json
          # Releases are pre-releases until a board test is recorded (flip by hand
          # on GitHub once docs/triage ledger rows read "board-verified").
          # This gate only covers tags created AFTER commit ce8b39c. The existing
          # v2026101802 release (tag at 15d42b3) predates it; it was marked
          # pre-release by .github/workflows/mark-prerelease.yml.
          prerelease: true
          body: |
            **NOT BOARD-TESTED.** This binary is CI-compiled only; it was never flashed.
            Rows P34/P41 change the storage layout (additive): coming from an older build,
            do an Esc-hold flash / settings reset. No board results are recorded yet, and
            delivery of the board-test request to the owner is unconfirmed (Telegram not paired).
            See CHANGELOG.md and docs/triage/2026101802-ledger.md.
          generate_release_notes: true
